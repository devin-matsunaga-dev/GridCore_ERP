version: 2

updates:
  # ---------------------------------------------------------------------------------------------
  # NuGet. Versions are centrally managed in Directory.Packages.props, so that is the single file
  # Dependabot edits.
  # ---------------------------------------------------------------------------------------------
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      # One PR per family rather than one per package: these ship in lockstep and a partial bump
      # is a restore failure waiting to happen.
      aspire:
        patterns: ['Aspire.*']
      entity-framework:
        patterns: ['Microsoft.EntityFrameworkCore*', 'Npgsql*']
      opentelemetry:
        patterns: ['OpenTelemetry.*']
      testing:
        patterns: ['xunit*', 'Microsoft.NET.Test.Sdk', 'coverlet.*', 'Testcontainers.*', 'Respawn']
    ignore:
      # MassTransit 9.x moved to a commercial licence; 8.5.10 is the last Apache-2.0 line and this
      # project stays on it (DECISIONS.md, WP-0.5). Dependabot must never open that PR — an
      # accepted bump would relicense the product's messaging layer. Do not remove this rule.
      - dependency-name: MassTransit
        versions: ['>=9.0.0']
      - dependency-name: MassTransit.RabbitMQ
        versions: ['>=9.0.0']
      - dependency-name: MassTransit.EntityFrameworkCore
        versions: ['>=9.0.0']

  # ---------------------------------------------------------------------------------------------
  # npm. The SPA lives in web/, which is where package-lock.json is.
  # ---------------------------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom', 'react-router']
      tooling:
        patterns: ['vite', '@vitejs/*', 'vitest', '@vitest/*', 'typescript', 'jsdom', '@testing-library/*']
      tailwind:
        patterns: ['tailwindcss', '@tailwindcss/*', 'tw-animate-css']

  # ---------------------------------------------------------------------------------------------
  # The workflows themselves — an unmaintained pinned action is the same risk as a stale package.
  # ---------------------------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(ci)
